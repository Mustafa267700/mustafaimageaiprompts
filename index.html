    <style>

            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --subtext-color: #94a3b8;
            --border-color: #00f3ff;
            --prompt-bg: #0f172a;
            --input-bg: #1e293b;
            --footer-bg: #090d16;
            --neon-glow: 0 0 15px rgba(0, 243, 255, 0.4), inset 0 0 10px rgba(0, 243, 255, 0.2);
            --neon-glow-hover: 0 0 25px rgba(0, 243, 255, 0.8), 0 0 10px rgba(0, 243, 255, 0.5);
            --shimmer-color-1: rgba(30, 41, 59, 1);
            --shimmer-color-2: rgba(0, 243, 255, 0.15);
            --neon-yellow: #ffea00;
        }

        body.light-theme {
            --bg-color: #f1f5f9;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --subtext-color: #64748b;
            --border-color: #00b4d8;
            --prompt-bg: #f8fafc;
            --input-bg: #ffffff;
            --footer-bg: #e2e8f0;
            --neon-glow: 0 0 12px rgba(0, 180, 216, 0.3);
            --neon-glow-hover: 0 0 20px rgba(0, 180, 216, 0.6);
            --shimmer-color-1: rgba(255, 255, 255, 1);
            --shimmer-color-2: rgba(0, 180, 216, 0.15);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); padding: 20px 20px 0 20px; display: flex; flex-direction: column; min-height: 100vh; position: relative; overflow-x: hidden; }
        
        header { text-align: center; padding: 40px 0 20px 0; position: relative; z-index: 10; }
        header h1 { font-size: 2.2rem; margin-bottom: 8px; color: #00f3ff; text-shadow: 0 0 10px rgba(0, 243, 255, 0.5); position: relative; z-index: 11; }
        header p.subtitle { color: var(--subtext-color); font-size: 1.1rem; margin-bottom: 15px; position: relative; z-index: 11; }
        
        .header-controls { position: absolute; top: 10px; right: 10px; display: flex; align-items: center; gap: 12px; z-index: 20; }
        .theme-toggle { background-color: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-color); padding: 8px 14px; border-radius: 20px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; box-shadow: var(--neon-glow); transition: all 0.3s ease; height: 36px; }
        .theme-toggle:hover { border-color: #00f3ff; box-shadow: var(--neon-glow-hover); }

        .lang-switch { position: relative; width: 75px; height: 36px; background-color: var(--card-bg); border: 2px solid var(--border-color); border-radius: 20px; cursor: pointer; box-shadow: var(--neon-glow); transition: all 0.3s ease; display: flex; align-items: center; padding: 2px; user-select: none; }
        .lang-switch:hover { box-shadow: var(--neon-glow-hover); }
        .lang-slider-circle { width: 28px; height: 28px; background-color: #00f3ff; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: bold; color: #0f172a; transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 0 8px rgba(0, 243, 255, 0.8); }
        .lang-switch.active .lang-slider-circle { transform: translateX(39px); }

        .header-top-info { margin-bottom: 20px; position: relative; z-index: 11; }
        .copyright-text { color: var(--subtext-color); font-size: 0.9rem; margin-bottom: 12px; }
        
        .instagram-link { display: inline-flex; align-items: center; gap: 10px; color: #ffffff; font-weight: 600; text-decoration: none; font-size: 0.95rem; padding: 10px 22px; border-radius: 30px; background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); box-shadow: 0 4px 15px rgba(225, 48, 108, 0.35); transition: all 0.3s ease; position: relative; z-index: 12; }
        .instagram-link:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(225, 48, 108, 0.55); opacity: 0.95; }
        .instagram-link svg { width: 20px; height: 20px; fill: #ffffff; }

        .controls-container { max-width: 600px; margin: 0 auto 30px auto; width: 100%; position: relative; z-index: 15; display: flex; flex-direction: column; gap: 15px; }
        .search-input { width: 100%; padding: 14px 20px; font-size: 1rem; border-radius: 30px; border: 2px solid var(--border-color); background-color: var(--input-bg); color: var(--text-color); outline: none; box-shadow: var(--neon-glow); transition: all 0.3s ease; }
        .search-input:focus { border-color: #00f3ff; box-shadow: var(--neon-glow-hover); }
        .search-input::placeholder { color: var(--subtext-color); }

        .fav-filter-btn { background-color: var(--card-bg); border: 2px solid var(--border-color); color: var(--text-color); padding: 10px 20px; border-radius: 30px; cursor: pointer; font-weight: bold; font-size: 0.95rem; box-shadow: var(--neon-glow); transition: all 0.3s ease; align-self: center; display: flex; align-items: center; gap: 8px; }
        .fav-filter-btn:hover { box-shadow: var(--neon-glow-hover); border-color: #00f3ff; }
        .fav-filter-btn.active { background-color: #00f3ff; color: #0f172a; box-shadow: var(--neon-glow-hover); border-color: #00f3ff; }

        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 25px; max-width: 1200px; margin: 0 auto 20px auto; flex: 1; width: 100%; position: relative; z-index: 10; }
        
        .card { background-color: var(--card-bg); border-radius: 12px; overflow: hidden; border: 2px solid var(--border-color); box-shadow: var(--neon-glow); transition: all 0.3s ease; width: 100%; position: relative; z-index: 11; display: flex; flex-direction: column; }
        .card:hover { transform: translateY(-5px); box-shadow: var(--neon-glow-hover); }
        
        .card-img-wrapper { position: relative; overflow: hidden; border-bottom: 1px solid var(--border-color); z-index: 12; cursor: pointer; aspect-ratio: 1/1; display: flex; align-items: center; justify-content: center; background: linear-gradient(90deg, var(--shimmer-color-1) 0%, var(--shimmer-color-2) 50%, var(--shimmer-color-1) 100%); background-size: 200% 100%; animation: shimmer 2s infinite linear; }
        .card-img-wrapper.wrapper-loaded { background: var(--bg-color); animation: none; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .card img { width: 100%; height: 100%; object-fit: contain; display: block; opacity: 0; transition: transform 0.3s; z-index: 2; position: relative; }
        .card img.img-loaded { opacity: 1; }
        
        .slider-card .card-img-wrapper { cursor: default; }
        .slider-container { width: 100%; height: 100%; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .slider-wrapper { display: flex; transition: transform 0.5s ease-in-out; width: 100%; height: 100%; }
        .slider-item { flex: 0 0 100%; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative; }
        
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.6); color: #00f3ff; border: 2px solid #00f3ff; border-radius: 50%; font-size: 1.2rem; padding: 8px 12px; cursor: pointer; z-index: 15; box-shadow: 0 0 10px rgba(0,243,255,0.5); transition: all 0.3s; opacity: 0.7; }
        .slider-btn:hover { box-shadow: 0 0 15px rgba(0,243,255,0.8); opacity: 1; transform: translateY(-50%) scale(1.1); }
        .prev-btn { left: 10px; }
        .next-btn { right: 10px; }
        
        .play-pause-btn { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.6); color: #00f3ff; border: 2px solid #00f3ff; border-radius: 6px; padding: 4px 10px; font-size: 0.8rem; font-weight: bold; cursor: pointer; z-index: 15; box-shadow: 0 0 10px rgba(0,243,255,0.5); transition: all 0.3s; }
        .play-pause-btn:hover { box-shadow: 0 0 15px rgba(0,243,255,0.8); }

        .card-img-wrapper::after { content: attr(data-zoom-text); position: absolute; bottom: 10px; right: 10px; background: rgba(0,0,0,0.75); color: #fff; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; opacity: 0; transition: opacity 0.3s; z-index: 13; pointer-events: none; }
        .card-img-wrapper:hover::after { opacity: 1; }
        .slider-card .card-img-wrapper::after { bottom: 10px; right: 10px; z-index: 16; }

        .card-body { padding: 20px; position: relative; z-index: 12; flex: 1; display: flex; flex-direction: column; background-color: var(--card-bg); }
        
        .card-header-row { display: flex; justify-content: flex-end; align-items: flex-start; margin-bottom: 12px; }
        
        .bookmark-btn { background: none; border: none; cursor: pointer; padding: 0; outline: none; transition: transform 0.2s ease; display: flex; align-items: center; justify-content: center; }
        .bookmark-btn:hover { transform: scale(1.15); }

        .bookmark-btn.saved .bookmark-icon { fill: var(--neon-yellow); filter: drop-shadow(0 0 10px rgba(255, 234, 0, 0.9)); }

        .prompt-title { font-size: 0.9rem; color: var(--subtext-color); margin-bottom: 6px; }
        .prompt-text { background-color: var(--prompt-bg); padding: 12px; border-radius: 8px; font-size: 0.95rem; color: var(--text-color); font-family: monospace; border: 1px solid var(--border-color); box-shadow: inset 0 0 8px rgba(0, 243, 255, 0.2); margin-bottom: 15px; word-break: break-word; flex: 1; overflow-y: auto; max-height: 150px; }
        .prompt-text::-webkit-scrollbar { width: 6px; }
        .prompt-text::-webkit-scrollbar-track { background: transparent; }
        .prompt-text::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
        
        .copy-btn { width: 100%; background-color: #00f3ff; color: #0f172a; border: none; padding: 10px; border-radius: 6px; font-weight: bold; cursor: pointer; box-shadow: 0 0 10px rgba(0, 243, 255, 0.3); transition: all 0.3s ease; position: relative; z-index: 13; margin-top: auto; }
        .copy-btn:hover { background-color: #70f8ff; box-shadow: 0 0 15px rgba(0, 243, 255, 0.6); }
        
        .no-results { text-align: center; color: var(--subtext-color); font-size: 1.2rem; margin: 40px 0; display: none; width: 100%; grid-column: 1 / -1; position: relative; z-index: 11; }

        /* INFINITE SCROLL / LOAD SENTINEL */
        #scrollSentinel { height: 40px; width: 100%; display: flex; justify-content: center; align-items: center; margin-bottom: 20px; z-index: 10; position: relative; }
        .loading-spinner { width: 30px; height: 30px; border: 3px solid rgba(0, 243, 255, 0.2); border-top-color: #00f3ff; border-radius: 50%; animation: spin 0.8s linear infinite; display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .back-to-top { position: fixed; bottom: 20px; right: 20px; background-color: #00f3ff; color: #0f172a; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 1.3rem; font-weight: bold; cursor: pointer; display: none; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(0, 243, 255, 0.5); transition: transform 0.2s, opacity 0.3s; z-index: 100; }
        .back-to-top:hover { transform: scale(1.1); background-color: #70f8ff; }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.9); justify-content: center; align-items: center; padding: 20px; }
        .modal-content { max-width: 95%; max-height: 90vh; border-radius: 8px; border: 2px solid #00f3ff; box-shadow: 0 0 25px rgba(0,243,255,0.6); object-fit: contain; z-index: 1001; }
        .close-modal { position: absolute; top: 15px; right: 25px; color: #fff; font-size: 35px; font-weight: bold; cursor: pointer; transition: color 0.2s; z-index: 1002; }

        footer { margin-top: auto; background-color: var(--footer-bg); padding: 20px 0; text-align: center; border-top: 1px solid var(--border-color); margin-left: -20px; margin-right: -20px; position: relative; z-index: 10; }
        footer p { color: var(--subtext-color); font-size: 0.85rem; position: relative; z-index: 11; }

        #trail-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; display: none; }

        .trail-dot { position: absolute; width: 10px; height: 10px; background-color: #00f3ff; border-radius: 50%; pointer-events: none; box-shadow: 0 0 10px #00f3ff, 0 0 15px #00f3ff; opacity: 1; transform: translate(-50%, -50%) scale(1); transition: transform 0.3s ease-out, opacity 0.3s ease-out; z-index: 2; will-change: transform, opacity; }

            .card-body { padding: 15px; }
            .prompt-text { font-size: 0.88rem; max-height: 120px; }
            .slider-btn { padding: 6px 10px; font-size: 1rem; }
        }
    </style>
</head>

                        <div class="prompt-title">Prompt:</div>
                        <div class="prompt-text" id="${card.promptId}">${card.promptText}</div>
                        <button class="copy-btn" onclick="copyPrompt('${card.promptId}', this)">${data.copyBtn}</button>
                    </div>
                </div>`;
            }
        }

        // --- LAZY RENDER VE İNFİNİTE SCROLL MANAGE ---
        function renderNextChunk() {
            if (isRendering || renderIndex >= activeFilteredData.length) return;
            isRendering = true;

            const spinner = document.getElementById('loadingSpinner');
            const isFirstChunk = renderIndex === 0;
            if(!isFirstChunk) spinner.style.display = 'block';

            const doRender = () => {
                const startIndex = renderIndex;
                const nextChunk = activeFilteredData.slice(renderIndex, renderIndex + ITEMS_PER_PAGE);
                const gallery = document.getElementById('gallery');
                
                const fragment = document.createDocumentFragment();
                const tempDiv = document.createElement('div');

                nextChunk.forEach((card, i) => {
                    tempDiv.innerHTML = createCardHTML(card, startIndex + i);
                    fragment.appendChild(tempDiv.firstElementChild);
                });

                gallery.appendChild(fragment);
                renderIndex += nextChunk.length;

                // Yeni eklenen slider'ları başlat
                initSliders();

                spinner.style.display = 'none';
                isRendering = false;

                // Filtreleme sonucu kontrolü
                const noResults = document.getElementById('noResults');
                if (activeFilteredData.length === 0) {
                    noResults.style.display = "block";
                } else {
                    noResults.style.display = "none";
                }
            };

            // İlk (kritik) yükleme anında render edilir; sonraki sayfalarda
            // spinner'ın görünmesi için ufak bir gecikme bırakılır.
            if (isFirstChunk) { doRender(); } else { setTimeout(doRender, 100); }
        }

        function initInfiniteScroll() {
            const sentinel = document.getElementById('scrollSentinel');
            if (observer) observer.disconnect();

            observer = new IntersectionObserver((entries) => {
                if (entries[0].isIntersecting) {
                    renderNextChunk();
                }
            }, { rootMargin: '300px' });

            observer.observe(sentinel);
        }

        function handleFilterChange() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            
            activeFilteredData = cardsData.filter(card => {
                const matchesSearch = card.promptText.toLowerCase().includes(query);
                const matchesSaved = showOnlySaved ? savedList.includes(card.id) : true;
                return matchesSearch && matchesSaved;
            });

            // Galeriyi sıfırla ve yeniden render başlat
            resetSliders();
            document.getElementById('gallery').innerHTML = '';
            renderIndex = 0;

            const noResults = document.getElementById('noResults');
            noResults.style.display = activeFilteredData.length === 0 ? 'block' : 'none';

            if (activeFilteredData.length > 0) {
                renderNextChunk();
            }
        }

        function updatePageLanguage() {
            const data = i18n[currentLang];
            document.getElementById('siteTitle').innerText = data.title;
            document.getElementById('siteSubtitle').innerText = data.subtitle;
            document.getElementById('copyrightText').innerText = data.copyright;
            document.getElementById('instaText').innerText = data.insta;
            document.getElementById('searchInput').placeholder = data.searchPlaceholder;
            document.getElementById('noResults').innerText = data.noResults;
            document.getElementById('footerText').innerText = data.footer;

            const favFilterBtn = document.getElementById('favFilterBtn');
            if (showOnlySaved) {
                favFilterBtn.innerText = data.showAll;
            } else {
                favFilterBtn.innerText = data.showSaved;
            }

            const switchBtn = document.getElementById('langSwitch');
            const circleBtn = document.getElementById('langCircle');
            if (currentLang === 'EN') { switchBtn.classList.add('active'); circleBtn.innerText = 'EN'; } else { switchBtn.classList.remove('active'); circleBtn.innerText = 'TR'; }

            document.querySelectorAll('.copy-btn').forEach(btn => { if (!btn.innerText.includes("✓")) { btn.innerText = data.copyBtn; } });
            document.querySelectorAll('.card-img-wrapper').forEach(wrapper => { wrapper.setAttribute('data-zoom-text', data.zoomText); });
            
            document.querySelectorAll('.play-pause-btn').forEach(playBtn => {
                const cardId = playBtn.closest('.slider-container').getAttribute('data-card-id');
                playBtn.textContent = sliders[cardId] && sliders[cardId].autoPlayInterval ? data.pause : data.play;
            });

            const themeBtn = document.getElementById('themeBtn');
            if (document.body.classList.contains('light-theme')) { themeBtn.innerText = data.themeLight; } else { themeBtn.innerText = data.themeDark; }
            document.documentElement.lang = currentLang.toLowerCase();
        }

        function toggleLanguage() { 
            currentLang = currentLang === 'TR' ? 'EN' : 'TR'; 
            localStorage.setItem('siteLang', currentLang); 
            updatePageLanguage(); 
        }

        function toggleBookmark(event, cardId, btn) {
            if(event) event.stopPropagation();
            
            const index = savedList.indexOf(cardId);
            if (index > -1) {
                savedList.splice(index, 1);
                btn.classList.remove('saved');
            } else {
                savedList.push(cardId);
                btn.classList.add('saved');
            }
            
            localStorage.setItem('aiPromptsFavs', JSON.stringify(savedList));
            
            if(showOnlySaved) {
                handleFilterChange();
            }
        }

        function toggleShowSaved() {
            showOnlySaved = !showOnlySaved;
            const btn = document.getElementById('favFilterBtn');
            const data = i18n[currentLang];
            
            if (showOnlySaved) {
                btn.classList.add('active');
                btn.innerText = data.showAll;
            } else {
                btn.classList.remove('active');
                btn.innerText = data.showSaved;
            }
            handleFilterChange();
        }

        function copyPrompt(id, btn) {
            const text = document.getElementById(id).innerText;
            const data = i18n[currentLang];
            navigator.clipboard.writeText(text).then(() => {
                btn.innerText = data.copiedBtn; btn.style.backgroundColor = "#22c55e"; btn.style.color = "#ffffff"; btn.style.boxShadow = "0 0 15px rgba(34, 197, 94, 0.6)";
                setTimeout(() => { btn.innerText = data.copyBtn; btn.style.backgroundColor = "#00f3ff"; btn.style.color = "#0f172a"; btn.style.boxShadow = "0 0 10px rgba(0, 243, 255, 0.3)"; }, 2000);
            });
        }

        function toggleTheme() {
            const body = document.body; const btn = document.getElementById('themeBtn'); const data = i18n[currentLang];
            body.classList.toggle('light-theme');
            if (body.classList.contains('light-theme')) { 
                btn.innerText = data.themeLight; 
                localStorage.setItem('siteTheme', 'light');
            } else { 
                btn.innerText = data.themeDark; 
                localStorage.setItem('siteTheme', 'dark');
            }
        }

        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modal.style.display = "flex"; modalImg.src = imgSrc;
        }

        function closeModal() { document.getElementById('imageModal').style.display = "none"; }

        window.onscroll = function() {
            const topBtn = document.getElementById("backToTopBtn");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) { topBtn.style.display = "flex"; } else { topBtn.style.display = "none"; }
        };

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        // MOUSE PARÇACIK EFEKTİ (MASAÜSTÜ)
        if (window.innerWidth > 768) {
            const trailContainer = document.getElementById('trail-container');
            const dots = [];
            const maxDots = 10;
            let currentDotIndex = 0;

            for (let i = 0; i < maxDots; i++) {
                const dot = document.createElement('div');
                dot.className = 'trail-dot';
                dot.style.opacity = 0;
                trailContainer.appendChild(dot);
                dots.push(dot);
            }

            let isMouseMoving = false;
            document.addEventListener('mousemove', (e) => {
                if(!isMouseMoving){
                    window.requestAnimationFrame(() => {
                        const dot = dots[currentDotIndex];
                        dot.style.left = e.clientX + 'px';
                        dot.style.top = e.clientY + 'px';
                        dot.style.transition = 'none';
                        dot.style.opacity = 1;
                        dot.style.transform = 'translate(-50%, -50%) scale(1)';
                        
                        setTimeout(() => {
                            dot.style.transition = 'transform 0.4s ease-out, opacity 0.4s ease-out';
                            dot.style.opacity = 0;
                            dot.style.transform = 'translate(-50%, -50%) scale(0.1)';
                        }, 10);
                        
                        currentDotIndex = (currentDotIndex + 1) % maxDots;
                        isMouseMoving = false;
                    });
                    isMouseMoving = true;
                }
            });
        }

        // SLIDER YÖNETİMİ
        const sliders = {};

        function resetSliders() {
            Object.values(sliders).forEach(slider => {
                if (slider.autoPlayInterval) clearInterval(slider.autoPlayInterval);
            });
            Object.keys(sliders).forEach(cardId => delete sliders[cardId]);
        }

        function initSliders() {
            document.querySelectorAll('.slider-container').forEach(container => {
                const cardId = container.getAttribute('data-card-id');
                if(!sliders[cardId]) {
                    sliders[cardId] = { currentSlide: 0, totalSlides: container.querySelectorAll('.slider-item').length, autoPlayInterval: null, container: container, wrapper: container.querySelector('.slider-wrapper') };
                    startAutoPlay(cardId);
                }
            });
        }

        function showSlide(cardId, index) {
            const slider = sliders[cardId];
            if(!slider) return;
            if (index < 0) { slider.currentSlide = slider.totalSlides - 1; } else if (index >= slider.totalSlides) { slider.currentSlide = 0; } else { slider.currentSlide = index; }
            const offset = -slider.currentSlide * 100;
            slider.wrapper.style.transform = `translateX(${offset}%)`;
        }

        function nextSlide(btn, event) { 
            if(event) event.stopPropagation();
            const cardId = btn.closest('.slider-container').getAttribute('data-card-id'); 
            stopAutoPlay(cardId); showSlide(cardId, sliders[cardId].currentSlide + 1); 
        }

        function prevSlide(btn, event) { 
            if(event) event.stopPropagation();
            const cardId = btn.closest('.slider-container').getAttribute('data-card-id'); 
            stopAutoPlay(cardId); showSlide(cardId, sliders[cardId].currentSlide - 1); 
        }

        function startAutoPlay(cardId) {
            const slider = sliders[cardId];
            if (slider && !slider.autoPlayInterval) {
                slider.autoPlayInterval = setInterval(() => { showSlide(cardId, slider.currentSlide + 1); }, 3000);
                const playPauseBtn = slider.container.querySelector('.play-pause-btn');
                if(playPauseBtn) playPauseBtn.textContent = i18n[currentLang].pause;
            }
        }

        function stopAutoPlay(cardId) {
            const slider = sliders[cardId];
            if (slider && slider.autoPlayInterval) {
                clearInterval(slider.autoPlayInterval); slider.autoPlayInterval = null;
                const playPauseBtn = slider.container.querySelector('.play-pause-btn');
                if(playPauseBtn) playPauseBtn.textContent = i18n[currentLang].play;
            }
        }

        function toggleAutoPlay(btn, event) {
            if(event) event.stopPropagation();
            const cardId = btn.closest('.slider-container').getAttribute('data-card-id');
            if (sliders[cardId].autoPlayInterval) { stopAutoPlay(cardId); } else { startAutoPlay(cardId); }
        }

        // --- SAYFA BAŞLATMA ---
        window.addEventListener('load', () => { 
            handleFilterChange();
            initInfiniteScroll();
            updatePageLanguage(); 
        });
    </script>
</body>
</html>
